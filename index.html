<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8572A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pulso: entrena tu reacción</title>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#101828; --muted:#667085; --line:#EAECF0; --brand:#E8572A; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --stage:#1A2836; --stage-ink:#EEF3F7;
  --go:#159A58; --stop:#D2382D; --amber:#E39E00; --blue:#2C6BD3;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0B1220;--surface:#141C2B;--ink:#F2F4F7;--muted:#98A2B3;--line:#232D3F;--shadow:none;--stage:#09121A;--stage-ink:#E6EDF3;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1220;--surface:#141C2B;--ink:#F2F4F7;--muted:#98A2B3;--line:#232D3F;--shadow:none;--stage:#09121A;--stage-ink:#E6EDF3;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

#home{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font:700 26px/1.1 var(--display);letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.install{margin-left:auto;border:0;border-radius:999px;padding:10px 18px;background:var(--brand);color:#fff;font:600 15px/1 var(--body)}
.install[hidden]{display:none}
#iosHelp{border:0;border-radius:20px;padding:22px;max-width:340px;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
#iosHelp::backdrop{background:rgba(0,0,0,.45)}
#iosHelp h3{margin:0 0 8px;font-size:19px}
#iosHelp p{margin:0 0 18px;color:var(--muted)}
#iosHelp .install{margin:0;width:100%}
.summary{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.summary .lbl{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:4px}
.summary .big{font:700 46px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.summary .big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.summary .hintpb{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.stats{display:flex;gap:18px;text-align:right}
.stats b{display:block;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:6px}
.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cat h2{display:flex;align-items:center;gap:8px;font:600 15px/1.2 var(--body);color:var(--ink);margin:24px 4px 10px}
.cat h2 .dot{width:8px;height:8px;border-radius:50%}
.cat h2 .count{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
.card{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .play{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;padding:13px 4px 13px 14px}
.row .play:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.row .name{display:block;font:600 16px/1.25 var(--body)}
.row .desc{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.rec{flex:none;font:600 13px/1 var(--body);font-variant-numeric:tabular-nums;padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--go) 14%,transparent);color:var(--go);white-space:nowrap}
.rec.none{background:var(--line);color:var(--muted);font-weight:500}
.fav{background:none;border:0;padding:12px 14px 12px 8px;color:var(--muted);display:grid;place-items:center}
.fav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fav[aria-pressed="true"]{color:#F5A400}
.fav[aria-pressed="true"] svg{fill:currentColor}
.empty{color:var(--muted);text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:18px}
.foot{color:var(--muted);font-size:13px;margin-top:26px;text-align:center}

#play{position:fixed;inset:0;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#play[hidden]{display:none}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px}
.bar h3{flex:1;margin:0;font:600 18px/1.2 var(--body)}
.bar .prog{font:600 15px/1 var(--body);font-variant-numeric:tabular-nums;opacity:.8}
.exit{background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;font-size:15px}
#stage{flex:1;display:flex;flex-direction:column;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
#stage.fx-ok{box-shadow:inset 0 0 0 6px var(--go)}
#stage.fx-bad{box-shadow:inset 0 0 0 6px var(--stop)}
.vis{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.msg{padding:16px 20px 24px;text-align:center;min-height:110px}
.msg.small{min-height:64px;padding:10px 20px 18px}
.msg[hidden]{visibility:hidden;display:block}
.msg b{display:block;font:700 56px/1 var(--display);font-variant-numeric:tabular-nums;margin-bottom:6px}
.msg span{display:block;max-width:42ch;margin:0 auto;opacity:.85}
.msg .tap{margin-top:10px;font-weight:600;color:var(--amber);opacity:1}
.msg .rounds{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 6px}
.msg .rounds button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);font:500 28px/1 var(--body);display:grid;place-items:center;padding:0}
.msg .rounds span{display:flex;align-items:baseline;gap:6px;margin:0;min-width:120px;justify-content:center;opacity:1;font-size:16px}
.msg .rounds b{display:inline;font:700 34px/1 var(--display);margin:0}
.cd{position:absolute;inset:0;display:grid;place-items:center;background:var(--stage);z-index:5}
.cd b{font:700 clamp(120px,40vw,240px)/1 var(--display);font-variant-numeric:tabular-nums;animation:cdpop .8s ease-out}
@keyframes cdpop{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}
.stim{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%;padding:12px;text-align:center}
.prompt{font-size:17px;opacity:.8}
.word{font:700 clamp(54px,16vw,110px)/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.word.sm{font-size:clamp(38px,11vw,72px)}
.glyph{font:700 clamp(90px,26vw,160px)/1 var(--display);display:inline-block}
.glyph.sm{font-size:44px}
.arrow{font:700 clamp(110px,32vw,190px)/1 var(--body)}
.hand{font-size:clamp(80px,24vw,130px);line-height:1}
.answers{display:grid;gap:10px;padding:0 14px 22px;max-width:560px;margin:0 auto;width:100%}
.answers button{display:flex;align-items:center;gap:10px;justify-content:center;min-height:58px;padding:10px;border-radius:14px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font:700 26px/1 var(--display)}
.answers button.hit{background:rgba(255,255,255,.25)}
#stage.center{justify-content:safe center;overflow-y:auto}
#stage.center .vis{flex:none;padding:8px 14px 14px;overflow:visible}
#stage.center .stim{height:auto;padding:0;max-width:460px}
#stage.center .answers{max-width:min(460px,100%);padding-bottom:14px;box-sizing:border-box}
#stage.center .answers button{min-height:64px;font-size:clamp(24px,7vw,34px)}
#stage.center .answers.sq button{aspect-ratio:4/3;min-height:0;font-size:clamp(24px,min(9vw,5.5vh),44px)}
#stage.center .answers.k4{gap:8px}
#stage.center .answers.k4 button{aspect-ratio:1;font-size:clamp(20px,min(6.5vw,4.5vh),34px)}
#stage.center .box{height:min(26vh,240px);width:min(92vw,520px,110vh)}
#stage.center .dots{width:min(58vw,230px,30vh)}
#stage.center .pie{width:min(46vw,190px,26vh)}
#stage.center .frames{width:min(70vw,280px,40vh)}
#stage.center .word{font-size:clamp(40px,min(13vw,11vh),90px)}
#stage.center .arrow{font-size:clamp(70px,min(26vw,20vh),150px)}
.msg.intro{min-height:0;max-width:460px}
.msg .seg{display:inline-flex;margin:18px auto 2px;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;gap:3px}
.msg .seg button{border:0;background:none;border-radius:9px;padding:10px 22px;font:600 16px/1 var(--body);color:var(--stage-ink);opacity:.7}
.msg .seg button[aria-pressed="true"]{background:var(--amber);color:#1B1300;opacity:1}
.banner{width:100%;padding:18px 12px;border-radius:14px;background:var(--amber);color:#1B1300;font:700 clamp(34px,10vw,48px)/1 var(--display);letter-spacing:.04em;text-align:center}
.answers i.sw{width:18px;height:18px;border-radius:4px}
.answers .swbig{width:100%;height:36px;border-radius:8px}
.answers .ln{display:block;height:8px;background:currentColor;border-radius:4px}
.answers .lnwrap{width:100%;text-align:left}

.panel{margin:0 14px;border-radius:22px;font:700 clamp(32px,9vw,64px)/1 var(--display)}
.panel.idle{background:rgba(255,255,255,.06)}
.panel.wait{background:var(--stop)}
.panel.go{background:var(--go)}
.lights{display:flex;gap:clamp(8px,3vw,22px);padding:22px;background:#05090D;border-radius:18px}
.lights i{width:clamp(42px,13vw,90px);aspect-ratio:1;border-radius:50%;background:#2A1414;box-shadow:inset 0 -6px 0 rgba(0,0,0,.4)}
.lights i.on{background:#FF3B2E;box-shadow:0 0 28px #FF3B2E,inset 0 -6px 0 rgba(0,0,0,.25)}
.ear{width:150px;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.25);display:grid;place-items:center}
.ear::after{content:"";width:46px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.25)}
.ear.ring{border-color:var(--amber)} .ear.ring::after{background:var(--amber)}
.morph{width:min(50vw,200px);aspect-ratio:1;border-radius:50%;background:var(--blue)}
.morph.sq{border-radius:14px}
.six{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.six i{width:clamp(50px,16vw,90px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18)}
.six i.lit{background:var(--amber)}
.field{margin:0 14px;border-radius:22px;background:rgba(255,255,255,.04)}
.dot{width:min(46vw,200px);aspect-ratio:1;border-radius:50%}
.dot.go{background:var(--go)} .dot.stop{background:var(--stop)}
.blk{width:min(66vw,300px);aspect-ratio:1;border-radius:22px}
.pair{display:flex;gap:16vw;font:700 clamp(70px,22vw,140px)/1 var(--display)}
.fix{font:500 44px/1 var(--display);opacity:.6}
.tgt{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle,#fff 0 18%,var(--stop) 19% 45%,#fff 46% 62%,var(--stop) 63%)}
.box{position:relative;width:min(92vw,520px);height:min(42vh,360px);border-radius:16px;background:rgba(255,255,255,.05);overflow:hidden;flex:none}
.vis.field .ball,.box .ball{position:absolute;left:0;top:0}
.ball{width:50px;height:50px;border-radius:50%;background:var(--amber);border:0;padding:0;display:grid;place-items:center;font:700 24px/1 var(--display);color:#1B1300;font-style:normal}
.ball.go{background:var(--go)}
.dots{position:relative;width:min(78vw,300px);aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.05)}
.dots .pt{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff}
.sides{display:flex;gap:10px;width:min(94vw,560px)}
.sides .dots{flex:1;width:auto}
.frames{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(84vw,340px)}
.frames i{aspect-ratio:1;border:6px solid;border-radius:6px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 22px;font:700 clamp(30px,9vw,46px)/1.1 var(--display)}
.pie{width:min(58vw,240px)} .pie circle{fill:var(--amber)} .pie line{stroke:var(--stage);stroke-width:2.5}
.arrows{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;font:700 clamp(40px,12vw,64px)/1 var(--body)}
.mini{display:grid;grid-template-columns:repeat(3,26px);gap:4px}
.mini i{width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,.12)}
.mini i.on{background:var(--amber)}
.pairg{display:flex;align-items:center;gap:22px;font-size:30px}
.combo{display:flex;gap:16px;font:700 clamp(42px,12vw,70px)/1 var(--body)}
.combo span.ok{opacity:.2}
.lanes .ball{color:#1B1300}

.grid{display:grid;gap:6px;width:min(92vw,56vh,460px)}
.grid button{aspect-ratio:1;border:0;border-radius:10px;background:rgba(255,255,255,.09);font:700 clamp(18px,5.5vw,32px)/1 var(--display);
  display:grid;place-items:center;padding:0;overflow:hidden}
.grid button svg{width:68%;height:68%}
.grid button.done{opacity:.22}
.grid button.bad{background:var(--stop)}
.grid.mem button.done{opacity:1;background:rgba(255,255,255,.22)}
.grid button.show{outline:3px solid var(--amber);outline-offset:-3px}
.grid button i.lit{display:block;width:100%;height:100%;background:var(--amber)}
.grid button i.sw{display:block;width:76%;height:76%;border-radius:8px}
.grid.mem{transition:transform .6s ease}
.hint{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.hint svg{width:30px;height:30px}
.hint i{width:22px;height:22px;border-radius:5px;display:inline-block}

.duel{flex:1;display:flex;flex-direction:column}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center}
.half.top{transform:rotate(180deg);border-bottom:2px solid rgba(255,255,255,.15)}
.half.wait{background:var(--stop)} .half.go{background:var(--go)}
.half .pts{font:700 54px/1 var(--display)}
.half .hmsg{font:700 clamp(24px,7vw,40px)/1.1 var(--display)}
.half .hopts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.half .hopts button{min-width:76px;min-height:56px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);font:700 28px/1 var(--display)}
.half .hopts button.bad{background:var(--stop)}

.result{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.result .score{font:700 clamp(76px,24vw,160px)/.9 var(--display);font-variant-numeric:tabular-nums}
.result .score small{font-size:.32em;margin-left:6px;opacity:.7}
.result .metric{opacity:.75;margin:6px 0 14px}
.result .detail{max-width:40ch;margin:0 0 6px}
.result .rec{font-weight:600;color:var(--amber);margin:4px 0 20px}
.scale{width:min(86vw,420px);margin:6px 0 18px}
.scale .track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--go),var(--amber) 55%,var(--stop))}
.scale .mark{position:absolute;top:-6px;width:4px;height:22px;margin-left:-2px;background:#fff;border-radius:2px}
.scale .ticks{display:flex;justify-content:space-between;font-size:13px;opacity:.7;margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:999px;padding:13px 24px;font:600 17px/1 var(--body);background:var(--amber);color:#1B1300}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--stage-ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="home">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg></div>
    <div><h1>Pulso</h1><p>Entrenamiento de reacción y atención</p></div>
    <button class="install" id="installBtn" hidden>Instalar</button>
  </header>
  <dialog id="iosHelp">
    <h3>Instalar Pulso</h3>
    <p>En Safari, toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y elige <b>Añadir a pantalla de inicio</b>.</p>
    <button class="install" id="iosClose">Entendido</button>
  </dialog>
  <section class="summary">
    <div><span class="lbl">Mejor reacción visual</span><div class="big" id="pbMain">—</div><span class="hintpb" id="pbHint"></span></div>
    <div class="stats"><div><b id="stPlayed">0</b><span>jugadas</span></div><div><b id="stTotal">0</b><span>pruebas</span></div></div>
  </section>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="all" aria-selected="true">Todos</button>
    <button role="tab" data-tab="fav" aria-selected="false">Favoritos</button>
    <button role="tab" data-tab="duo" aria-selected="false">Dos jugadores</button>
  </div>
  <div id="lists"></div>
  <p class="foot">Récords y favoritos se guardan solo en este dispositivo.</p>
</main>

<section id="play" hidden>
  <div class="bar">
    <button class="exit" id="exit">Salir</button>
    <h3 id="ptitle"></h3>
    <span class="prog" id="prog"></span>
  </div>
  <div id="stage"></div>
</section>

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const stage=$('#stage');
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const now=()=>performance.now();
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const pl=(n,s,p)=>`${n} ${n===1?s:p}`;
const store={
  get(k){try{const v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let timers=[],keyHandler=null,current=null,audioCtx=null,raf=0,loopTok=0;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function stopLoop(){loopTok++;cancelAnimationFrame(raf)}
function loop(fn){stopLoop();const tok=loopTok;let last=now();
  const step=()=>{if(tok!==loopTok)return;const t=now(),dt=Math.min(50,t-last)/1000;last=t;fn(dt,t);if(tok===loopTok)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step)}
function clearTimers(){timers.forEach(clearTimeout);timers=[];stopLoop()}

function bounce(box,els,speed){const W=box.clientWidth,H=box.clientHeight;
  const st=els.map(el=>{const a=rand(0,Math.PI*2);return{el,x:rand(0,W-50),y:rand(0,H-50),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed}});
  const draw=()=>st.forEach(s=>s.el.style.transform=`translate(${s.x}px,${s.y}px)`);draw();
  loop(dt=>{st.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.x<0||s.x>W-50){s.vx*=-1;s.x=Math.max(0,Math.min(W-50,s.x))}
    if(s.y<0||s.y>H-50){s.vy*=-1;s.y=Math.max(0,Math.min(H-50,s.y))}});draw()})}

function fitStage(){
  const el=stage.querySelector('.answers.sq')||stage.querySelector('.grid');if(!el)return;
  el.style.maxWidth='';el.style.width='';
  const st=stage.querySelector('.stim .box,.stim .dots,.stim .pie,.stim .frames');
  if(st)st.style.removeProperty('zoom');
  const over=()=>{if(stage.scrollHeight>stage.clientHeight+1)return true;const v=el.closest('.vis');if(!v)return false;const r=el.getBoundingClientRect(),q=v.getBoundingClientRect();return r.bottom>q.bottom+1||r.top<q.top-1};
  if(!over())return;
  let w=el.getBoundingClientRect().width,n=0;
  while(over()&&w>150&&n++<60){w-=10;el.style.maxWidth=w+'px';el.style.width=w+'px'}
}

function settings(cfg){const id=current&&current.id;const c={};
  if(cfg.pickRounds){let R=Math.min(20,Math.max(5,store.get('pulso:rounds:'+id)||cfg.N||10));c.rounds={get:()=>R,set:v=>{R=v;store.set('pulso:rounds:'+id,v)}}}
  if(cfg.sizes){let S=store.get('pulso:grid:'+id);if(S!==3&&S!==4)S=3;c.size={get:()=>S,set:v=>{S=v;store.set('pulso:grid:'+id,v)}}}
  return c}
function intro(text,start,ctl){
  const {rounds,size}=ctl||{};
  const sb=size?`<div class="seg">${[3,4].map(k=>`<button data-s="${k}" aria-pressed="${size.get()===k}">${k} × ${k}</button>`).join('')}</div>`:'';
  const rb=rounds?`<div class="rounds"><button data-r="-1" aria-label="Menos rondas">−</button><span><b id="rN">${rounds.get()}</b>rondas</span><button data-r="1" aria-label="Más rondas">+</button></div>`:'';
  stage.innerHTML=`<div class="vis"><div class="msg intro"><span>${text}</span>${sb}${rb}<span class="tap">Toca para empezar</span></div></div>`;
  const go=()=>{stage.onpointerdown=null;keyHandler=null;countdown(start)};
  const step=d=>{const v=Math.min(20,Math.max(5,rounds.get()+d));rounds.set(v);$('#rN').textContent=v};
  if(rounds)stage.querySelectorAll('.rounds button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();step(+b.dataset.r)});
  if(size)stage.querySelectorAll('.seg button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();size.set(+b.dataset.s);
    stage.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  stage.onpointerdown=e=>{e.preventDefault();go()};
  keyHandler=e=>{
    if(rounds&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();return step(e.key==='ArrowRight'?1:-1)}
    if(size&&(e.key==='3'||e.key==='4')){size.set(+e.key);stage.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===e.key));return}
    if(e.code==='Space'||e.key==='Enter')go()};
}
function gridNums(ans,K,min=0){const lo=Math.max(min,ans-ri(0,K-1));const opts=[...Array(K)].map((_,i)=>lo+i);return{opts,ans:opts.indexOf(ans),cols:Math.sqrt(K)}}

function countdown(cb){
  const o=document.createElement('div');o.className='cd';stage.appendChild(o);let n=3;
  const tick=()=>{if(n===0){o.remove();return cb()}o.innerHTML=`<b>${n}</b>`;n--;later(tick,800)};tick();

function simpleRT(cfg,done){const ctl=settings({pickRounds:true,N:Math.max(5,cfg.attempts)});
  intro(cfg.intro,()=>simpleRTrun({...cfg,attempts:ctl.rounds.get()},done),ctl)}
function simpleRTrun(cfg,done){
  stage.innerHTML='<div class="vis"></div><div class="msg"></div>';
  const vis=stage.querySelector('.vis'),msg=stage.querySelector('.msg');
  cfg.build(vis);
  let phase='ready',t0=0,started=true;const rts=[];
  const api={fire(offset=0){phase='go';t0=now()+offset}};
  const say=(big,small)=>{msg.innerHTML=(big?`<b>${big}</b>`:'')+`<span>${small}</span>`;msg.hidden=false};
  const ready=(big,small)=>{phase='ready';cfg.reset(vis);say(big,small)};
  setProgress(0,cfg.attempts);msg.hidden=true;phase='waiting';cfg.arm(vis,api);
  function act(){
    if(phase==='ready'){msg.hidden=true;
      if(!started){started=true;phase='cd';countdown(()=>{phase='waiting';cfg.arm(vis,api)})}
      else{phase='waiting';cfg.arm(vis,api)}}
    else if(phase==='waiting'){clearTimers();ready('Salida en falso','Respondiste antes de la señal. Toca para repetir el intento.')}
    else if(phase==='go'){
      const rt=Math.max(0,now()-t0);rts.push(rt);setProgress(rts.length,cfg.attempts);
      if(rts.length>=cfg.attempts){phase='done';cfg.reset(vis);say(Math.round(rt)+' ms','Último intento');
        later(()=>done({score:mean(rts),detail:`Media de ${rts.length} intentos. Mejor intento: ${Math.round(Math.min(...rts))} ms.`}),700)}
      else ready(Math.round(rt)+' ms','Toca para el siguiente intento.');
    }
  }
  stage.onpointerdown=e=>{e.preventDefault();act()};
  keyHandler=e=>{if(e.code==='Space'||e.key==='Enter')act()};
}

function choice(cfg){return done=>{const ctl=settings({...cfg,pickRounds:true});
 intro(cfg.intro,()=>{const R=ctl.rounds?ctl.rounds.get():(cfg.N||15);const S=ctl.size?ctl.size.get():0;
  stage.innerHTML='<div class="vis"><div class="stim"></div></div><div class="answers"></div>';stage.classList.add('center');
  const vis=stage.querySelector('.vis'),stim=stage.querySelector('.stim'),ans=stage.querySelector('.answers');
  const N=R;let i=0,t0=0,cur=null,errors=0,locked=true,pos=0;const rts=[];
  const next=()=>{
    if(i>=N)return done({score:mean(rts),detail:`${pl(rts.length,'acierto','aciertos')} y ${pl(errors,'error','errores')} de ${N}.`});
    stopLoop();cur=cfg.trial(i,S*S);i++;setProgress(i,N);pos=0;locked=true;
    if(cfg.dirs)cur.opts=DIRS;
    stim.innerHTML=cur.show||'';
    const nc=cur.cols||cfg.cols||Math.min(cur.opts.length,4);ans.style.gridTemplateColumns=`repeat(${nc},1fr)`;ans.className='answers'+(nc>=3&&cur.opts.length>=nc*2?' sq k'+nc:'');
    ans.innerHTML=cur.opts.map((o,k)=>`<button data-k="${k}">${o}</button>`).join('');
    ans.querySelectorAll('button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();choose(+b.dataset.k,b)});
    fitStage();const begin=()=>{locked=false;t0=now()};
    cur.setup?cur.setup(stim,begin):begin();
  };
  const choose=(k,b)=>{
    if(locked)return;
    if(cur.seq){
      if(k===cur.ans[pos]){pos++;if(b){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120)}
        const sp=stim.querySelectorAll('.combo span')[pos-1];if(sp)sp.classList.add('ok');
        if(pos<cur.ans.length)return;rts.push(now()-t0);feedback(true)}
      else{errors++;feedback(false)}
    }else{const ok=k===cur.ans;if(ok)rts.push(now()-t0);else errors++;feedback(ok)}
    locked=true;stopLoop();later(next,260);
  };
  if(cfg.dirs){let sx=0,sy=0;
    vis.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
    vis.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
      choose(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))}}
  const AK={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3};
  keyHandler=e=>{if(!cur)return;
    if(cfg.dirs&&e.key in AK){e.preventDefault();return choose(AK[e.key])}
    if(cfg.keys&&e.key in cfg.keys){e.preventDefault();return choose(cfg.keys[e.key])}
    if(cfg.byValue){const v=parseInt(e.key,10);if(v>=1&&v<=9)return choose(cur.opts.indexOf(v))}
    const k=parseInt(e.key,10)-1;if(k>=0&&k<cur.opts.length)choose(k)};
  next();
},ctl)}}

function gridTap(cfg){return done=>{const ctl=settings({...cfg,pickRounds:true,N:Math.max(5,cfg.rounds||5)});intro(cfg.intro,()=>{const S=ctl.size?ctl.size.get():5;

    const d=cfg.round(r,S);r++;setProgress(r,R);hint.innerHTML=d.hint||'';

function memGrid(cfg){return done=>{const ctl=settings(cfg);intro(cfg.intro,()=>{const S=ctl.size?ctl.size.get():4;

 run:done=>{const ctl=settings({pickRounds:true,N:12});intro('Mantén la vista en la cruz. Toca cada diana que aparezca cerca de los bordes.',()=>{
  stage.innerHTML='<div class="vis field"><div class="fix">+</div></div>';

  const next=()=>{if(i>=N){phase='done';return done({score:mean(rts),detail:`${rts.length} de ${N} dianas a tiempo y ${pl(wrong,'toque','toques')} fuera.`})}
    phase='gap';later(show,rand(500,1300))};
  const show=()=>{const r=field.getBoundingClientRect(),a=Math.random()*Math.PI*2;
    const t=document.createElement('button');t.className='tgt';t.setAttribute('aria-label','Diana');
    t.style.left=(r.width/2+Math.cos(a)*(r.width/2-40))+'px';t.style.top=(r.height/2+Math.sin(a)*(r.height/2-40))+'px';

def({sizes:true,...MEM,id:'celdas',cat:C5,name:'Memoria de celdas',desc:'Recuerda las celdas iluminadas y tócalas.',
 run:memGrid({sizes:true,intro:'Algunas celdas se iluminan un momento. Cuando se apaguen, tócalas. Tienes tres vidas.',
  level(L,S){const cols=S;const n=Math.min(1+L,cols*cols-2);const t=shuffle([...Array(cols*cols).keys()]).slice(0,n);
   return{cols,targets:t,memo:1000+n*80,show:[...Array(cols*cols)].map((_,k)=>t.includes(k)?'<i class="lit"></i>':'')}}})});
def({sizes:true,...MEM,id:'ascend',cat:C5,name:'Números en orden',desc:'Memoriza los números y tócalos de menor a mayor.',
 run:memGrid({sizes:true,intro:'Memoriza dónde está cada número. Cuando se oculten, tócalos de menor a mayor.',
  level(L,S){const cols=S;const n=Math.min(1+L,cols*cols);const pos=shuffle([...Array(cols*cols).keys()]).slice(0,n);
   const vals=new Set();while(vals.size<n)vals.add(ri(1,99));const v=[...vals];const show=[...Array(cols*cols)].fill('');pos.forEach((p,k)=>show[p]=v[k]);
   return{cols,ordered:true,memo:1200+n*300,show,targets:pos.map((p,k)=>[p,v[k]]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])}}})});
def({sizes:true,...MEM,id:'rotacion',cat:C5,name:'Rotación',desc:'Recuerda las celdas y encuéntralas tras el giro.',
 run:memGrid({sizes:true,intro:'Memoriza las celdas iluminadas. La tabla girará: encuéntralas en su nueva posición.',
  level(L,S){const n=Math.min(1+L,S*S-3);const t=shuffle([...Array(S*S).keys()]).slice(0,n);
   return{cols:S,targets:t,memo:1200,rotate:pick([90,-90,180]),show:[...Array(S*S)].map((_,k)=>t.includes(k)?'<i class="lit"></i>':'')}}})});
def({...GR,id:'parejas',cat:C5,name:'Parejas',desc:'Descubre las parejas de figuras iguales.',
 run:done=>intro('Toca dos celdas para descubrirlas. Encuentra las ocho parejas en el menor tiempo.',()=>{
  stage.innerHTML='<div class="vis"><div class="grid"></div></div><div class="msg small"><span></span></div>';
  const g=stage.querySelector('.grid');g.style.gridTemplateColumns='repeat(4,1fr)';
  const sym=k=>shape(TYPES[k],PAL[k%6].c);const items=shuffle([...Array(8)].flatMap((_,k)=>[k,k]));
  g.innerHTML=items.map((_,k)=>`<button data-k="${k}"></button>`).join('');
  let open=[],found=0,errors=0;const t0=now();setProgress(0,8);
  g.querySelectorAll('button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();const k=+b.dataset.k;
    if(open.length===2||b.dataset.on)return;b.dataset.on=1;b.innerHTML=sym(items[k]);open.push(b);
    if(open.length<2)return;const[a,c]=open;
    if(items[+a.dataset.k]===items[+c.dataset.k]){found++;setProgress(found,8);open=[];
      if(found===8)later(()=>done({score:(now()-t0)/1000,detail:`${pl(errors,'intento fallido','intentos fallidos')}.`}),400)}
    else{errors++;later(()=>{[a,c].forEach(x=>{x.innerHTML='';delete x.dataset.on});open=[]},650)}});
 })});
def({sizes:true,...MEM,id:'nueva',cat:C5,name:'Figura nueva',desc:'Cada ronda aparece una figura más. Encuentra la nueva.',
 run:done=>{const ctl=settings({sizes:true});intro('Cada ronda se añade una figura y todas cambian de sitio. Toca la que acaba de aparecer.',()=>{const S=ctl.size.get(),N=S*S;
  stage.innerHTML='<div class="vis"><div class="grid"></div></div><div class="msg small"><span></span></div>';
  const g=stage.querySelector('.grid'),hint=stage.querySelector('.msg span');g.style.gridTemplateColumns=`repeat(${S},1fr)`;
  const pool=shuffle(TYPES.flatMap(t=>PAL.map(p=>shape(t,p.c))));let r=1;
  const round=()=>{$('#prog').textContent=`Ronda ${r}`;hint.textContent=r===1?'Memoriza esta figura y tócala':'¿Cuál es la nueva?';
    const pos=shuffle([...Array(N).keys()]).slice(0,r+1);const cells=[...Array(N)].fill('');pos.forEach((p,k)=>cells[p]=pool[k]);
    const target=pos[r];
    if(r===1){cells.fill('');cells[pos[0]]=pool[0]}
    g.innerHTML=cells.map((c,k)=>`<button data-k="${k}">${c}</button>`).join('');
    g.querySelectorAll('button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();const k=+b.dataset.k;if(!cells[k])return;
      const ok=r===1?k===pos[0]:k===target;
      if(ok){feedback(true);if(r>=N-1)return done({score:r,detail:'Completaste todas las rondas.'});r++;g.innerHTML='';later(round,350)}
      else{feedback(false);b.classList.add('bad');g.children[target].classList.add('show');
        later(()=>done({score:r-1,detail:`Recordaste ${pl(r,'figura','figuras')} antes de fallar.`}),1100)}});
  };
  round();
 },ctl)}});

/* Dos jugadores */
function duel(kind){return()=>{
  stage.innerHTML='<div class="duel"><div class="half top"></div><div class="half"></div></div>';
  const all=stage.querySelectorAll('.half');const hs=[all[1],all[0]];
  const sc=[0,0],WIN=5;let state='ready',lock=[false,false],ans=0;$('#prog').textContent='';
  const paint=(cls,txt,opts)=>hs.forEach((h,p)=>{h.className='half'+(p===1?' top':'')+(cls?' '+cls:'');
    h.innerHTML=`<div class="pts">${sc[p]}</div><div class="hmsg">${typeof txt==='function'?txt(p):txt}</div><div class="hopts">${opts?shuffle(opts).map(v=>`<button data-v="${v}">${v}</button>`).join(''):''}</div>`});
  const end=()=>{state='end';paint('',p=>sc[p]>=WIN?'¡Has ganado!':'Has perdido');
    hs[0].querySelector('.hopts').innerHTML='<button class="btn" id="dA">Revancha</button><button class="btn ghost" id="dB">Salir</button>';
    $('#dA').onpointerdown=e=>{e.stopPropagation();start(current)};$('#dB').onpointerdown=e=>{e.stopPropagation();goHome()}};
  const point=(p,why)=>{sc[p]++;state='between';clearTimers();
    if(sc[p]>=WIN){paint('',q=>q===p?'Punto':'Punto del rival');return later(end,700)}
    paint('',q=>q===p?'Punto para ti':(why||'Punto del rival'));later(round,1300)};
  const round=()=>{lock=[false,false];
    if(kind==='rx'){state='wait';paint('wait','Espera…');later(()=>{state='go';paint('go','¡Ya!')},rand(1500,4200))}
    else{const m=Math.random()<.5;const a=m?ri(3,12):ri(10,60),b=m?ri(3,12):ri(10,40);ans=m?a*b:a+b;
      const o=numOpts(ans,3,m?8:6,0).opts;state='go';paint('',`${a} ${m?'×':'+'} ${b}`,o)}};
  const tap=(p,el)=>{
    if(state==='ready'){state='cd';return countdown(round)}
    if(kind==='rx'){if(state==='wait')point(1-p,'Salida en falso');else if(state==='go')point(p)}
    else if(state==='go'&&!lock[p]){const btn=el.closest('button[data-v]');if(!btn)return;
      if(+btn.dataset.v===ans)point(p);else{lock[p]=true;btn.classList.add('bad');if(lock[0]&&lock[1]){state='between';later(round,900)}}}
  };
  hs.forEach((h,p)=>h.onpointerdown=e=>{e.preventDefault();tap(p,e.target)});
  keyHandler=e=>{if(kind!=='rx')return;const k=e.key.toLowerCase();if(k==='l')tap(0,stage);else if(k==='a')tap(1,stage);else if(state==='ready'&&e.code==='Space'){state='cd';countdown(round)}};
  paint('',kind==='rx'?'Cuando tu mitad se ponga verde, tócala antes que tu rival':'Resuelve antes que tu rival. Si fallas, quedas fuera esa ronda');
  hs[0].querySelector('.hopts').innerHTML='<span>Toca para empezar</span>';
};}

def({id:'duelomates',cat:'duo',duo:true,name:'Duelo de cálculo',desc:'La misma operación para los dos. Responde antes que tu rival.',run:duel('mx')});

/* ---------- navegación ---------- */
const IC={
 rx:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 dec:'<path d="M12 21v-7M12 14 6 8V3M12 14l6-6V3M3 6l3-3 3 3M15 6l3-3 3 3"/>',
 vis:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 calc:'<path d="M5 7h5M7.5 4.5v5M14 7h5M5 17h5M14.5 14.5l4 4M18.5 14.5l-4 4"/>',
 mem:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 co:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 duo:'<circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="8" r="3"/><path d="M2 20c0-3.3 2.7-5 6-5s6 1.7 6 5M13 15.2c.9-.1 2.3-.2 3.5-.2 3.3 0 5.5 1.7 5.5 5"/>'};
const CATS={[C1]:['#E8572A',IC.rx],[C2]:['#D08A00',IC.dec],[C3]:['#2F6FEB',IC.vis],[C4]:['#7A5AF8',IC.calc],[C5]:['#0E9384',IC.mem],[C6]:['#16A34A',IC.co],duo:['#DB2777',IC.duo]};
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
const sizeOf=g=>store.get('pulso:grid:'+g.id)===4?4:3;
const bestKey=g=>'pulso:best:'+g.id+(g.sizes?':'+sizeOf(g)+'x'+sizeOf(g):'');
let tab='all';
const favs=()=>new Set(store.get('pulso:favs')||[]);
const ic=(cat)=>`<span class="ico" style="--c:${CATS[cat][0]}"><svg viewBox="0 0 24 24">${CATS[cat][1]}</svg></span>`;
function rowHTML(g,F){const b=store.get(bestKey(g));
  return `<li class="row"><button class="play" data-id="${g.id}">${ic(g.cat)}<span class="txt"><span class="name">${g.name}</span><span class="desc">${g.desc}</span></span>
   ${g.duo?'':`<span class="rec${b==null?' none':''}">${b==null?'Nuevo':fmt(b,g.unit)}</span>`}</button>
   <button class="fav" data-f="${g.id}" aria-pressed="${F.has(g.id)}" aria-label="Marcar ${g.name} como favorito">${STAR}</button></li>`}
const section=(title,cat,list,F)=>`<section class="cat"><h2><span class="dot" style="background:${CATS[cat][0]}"></span>${title}<span class="count">${list.length}</span></h2><ul class="card">${list.map(g=>rowHTML(g,F)).join('')}</ul></section>`;
function renderHome(){
  const F=favs();const solo=G.filter(g=>!g.duo);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  let html='';
  if(tab==='all')[C1,C2,C3,C4,C5,C6].forEach(c=>{html+=section(c,c,solo.filter(g=>g.cat===c),F)});
  else if(tab==='fav'){const l=G.filter(g=>F.has(g.id));html=l.length?`<section class="cat"><h2>Tus favoritos<span class="count">${l.length}</span></h2><ul class="card">${l.map(g=>rowHTML(g,F)).join('')}</ul></section>`:'<p class="empty">Toca la estrella de cualquier prueba para tenerla aquí a mano.</p>'}
  else html=section('Un móvil o tableta entre dos','duo',G.filter(g=>g.duo),F);
  $('#lists').innerHTML=html;
  $('#lists').querySelectorAll('.play').forEach(r=>r.onclick=()=>start(G.find(g=>g.id===r.dataset.id)));
  $('#lists').querySelectorAll('.fav').forEach(b=>b.onclick=()=>{const s=favs();s.has(b.dataset.f)?s.delete(b.dataset.f):s.add(b.dataset.f);store.set('pulso:favs',[...s]);renderHome()});
  const pb=store.get('pulso:best:color');
  $('#pbMain').innerHTML=pb==null?'—':`${Math.round(pb)}<small>ms</small>`;
  $('#pbHint').textContent=pb==null?'Juega Cambio de color para medirla':'';
  $('#stPlayed').textContent=solo.filter(g=>store.get(bestKey(g))!=null).length;
  $('#stTotal').textContent=solo.length;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderHome()});
function reset(){clearTimers();keyHandler=null;stage.onpointerdown=null;stage.className='';stage.innerHTML=''}
function start(g){reset();current=g;$('#ptitle').textContent=g.name;setProgress(0,0);$('#home').hidden=true;$('#play').hidden=false;g.run(r=>showResult(g,r))}
function showResult(g,r){
  reset();setProgress(0,0);
  const key=bestKey(g),prev=store.get(key);const valid=r.score!=null&&isFinite(r.score);
  const better=valid&&(prev==null||(g.hi?r.score>prev:r.score<prev));if(better)store.set(key,r.score);
  let scale='';
  if(g.ref&&valid){const p=Math.min(100,Math.max(0,(r.score-150)/300*100));
    scale=`<div class="scale" aria-hidden="true"><div class="track"><div class="mark" style="left:${p}%"></div></div><div class="ticks"><span>150</span><span>250</span><span>350</span><span>450 ms</span></div></div>`}
  stage.innerHTML=`<div class="result"><div class="score">${fmtBig(r.score,g.unit)}</div><p class="metric">${g.metric}${g.sizes?`, cuadrícula ${sizeOf(g)} × ${sizeOf(g)}`:''}</p>${scale}
    <p class="detail">${r.detail}</p>
    <p class="rec">${!valid?'Sin respuestas válidas en esta ronda.':better?(prev==null?'Primer récord guardado':'Nuevo récord personal'):'Tu récord: '+fmt(prev,g.unit)}</p>
    <div class="actions"><button class="btn" id="again">Jugar otra vez</button><button class="btn ghost" id="back">Volver a los juegos</button></div></div>`;
  $('#again').onclick=()=>start(g);$('#back').onclick=goHome;
  keyHandler=e=>{if(e.key==='Enter'||e.code==='Space')start(g)};
}
function goHome(){reset();current=null;$('#play').hidden=true;$('#home').hidden=false;renderHome()}
$('#exit').onclick=goHome;
renderHome();

/* instalación como app */
(()=>{const ib=$('#installBtn');let deferred=null;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone)ib.hidden=false});
  window.addEventListener('appinstalled',()=>{ib.hidden=true});
  if(isIOS&&!standalone)ib.hidden=false;
  ib.onclick=async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;ib.hidden=true}
    else{const d=$('#iosHelp');if(d.showModal)d.showModal();else alert(d.querySelector('p').textContent)}};
  $('#iosClose').onclick=()=>$('#iosHelp').close();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
